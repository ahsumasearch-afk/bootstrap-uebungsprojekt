<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt – Bergsteiger Hostel Innsbruck</title>
  <link rel="icon" href="img/logo-dunkel.svg">
  <!-- Bootstrap 5.3 vom CDN. Muss VOR dem eigenen CSS stehen. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/eigenes.css" rel="stylesheet">
</head>
<body>

<!-- Ziel dieser Seite: siehe vorschau/kontakt.png und loesung/kontakt.html

     1  Navigation      Wie auf den anderen Seiten.
     2  Seitenkopf      Dunkler Streifen mit Breadcrumb, h1 und Lead-Absatz.
     3  Kontaktdaten    Links (ab lg 5 von 12 Spalten): Adresse, Telefon,
                        E-Mail, Rezeption – je Icon + Text nebeneinander.
                        Darunter das Bild img/lage.svg.
     4  Formular        Rechts (ab lg 7 von 12 Spalten) in einer Card.
                        Raster aus Feldern: Vorname und Nachname je halbe Breite,
                        E-Mail und Telefon, Anreise und Abreise,
                        Zimmerart (Auswahl) und Personen (Zahl),
                        Nachricht über die volle Breite, Checkbox, Button.
                        Jedes Pflichtfeld bekommt eine eigene Fehlermeldung.
                        Nutze Bootstraps Formularprüfung: class="needs-validation"
                        und novalidate am <form>.
     5  Erfolgsmeldung  Ein Alert, der erst nach dem Absenden sichtbar wird
                        (id="erfolg", am Anfang mit d-none versteckt).
     6  Fußbereich      Wie auf index.html.
-->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Fertig vorgegeben: Bootstraps Formularprüfung.
  // Funktioniert, sobald dein <form> die Klasse needs-validation
  // und das Attribut novalidate hat.
  document.querySelectorAll('.needs-validation').forEach((formular) => {
    formular.addEventListener('submit', (ereignis) => {
      ereignis.preventDefault();
      ereignis.stopPropagation();
      if (formular.checkValidity()) {
        document.getElementById('erfolg').classList.remove('d-none');
        formular.classList.remove('was-validated');
        formular.reset();
        return;
      }
      formular.classList.add('was-validated');
    });
  });
</script>
</body>
</html>
